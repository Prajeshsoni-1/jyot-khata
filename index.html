<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jyot Khata</title>
<meta name="description" content="Client ledger with ready Hindi, English and Gujarati WhatsApp payment messages.">
<meta name="theme-color" content="#d4260e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a110f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jyot Khata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Jyot brand: logo red #E42B13, orange #F86C00, yellow #F9D306 */
:root{
  --bg:#fff8f0; --surface:#ffffff; --surface2:#fdeedd; --text:#2b1511; --muted:#7a5d52; --line:#f1dfcd;
  --primary:#d4260e; --primary-ink:#ffffff; --primary-soft:#fde5dc;
  --in:#12683c; --in-bg:#157347; --in-soft:#e0f3e7;
  --due:#a8480a; --due-bg:#c2570a; --due-soft:#fdecd2;
  --out:#1d4ed8; --out-bg:#1d4ed8; --out-soft:#e3ebfd;
  --wa-bg:#0f7a43; --danger:#b42318; --danger-soft:#fdeceb;
  --brand-grad:linear-gradient(90deg,#e8160c,#f86c00 55%,#f9d306);
  --shadow:0 1px 2px rgba(80,30,10,.06),0 6px 18px rgba(80,30,10,.08);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a110f; --surface:#261a17; --surface2:#33241f; --text:#fbede6; --muted:#c4a89c; --line:#44322b;
    --primary:#ff6a45; --primary-ink:#2a0a03; --primary-soft:#4a2219;
    --in:#5fdc8f; --in-soft:#143a26; --due:#ffb454; --due-soft:#3d2a10; --out:#8fb0ff; --out-soft:#1a2748;
    --danger:#ff8a80; --danger-soft:#3a1816;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }
}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:var(--brand-grad);z-index:60}
.brand-logo{width:46px;height:46px;flex:none;display:block}
.empty-logo{width:104px;height:104px;display:block;margin:0 auto 12px}
.about{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;color:var(--muted);font-size:13px}
.about img{width:30px;height:30px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans Gujarati","Nirmala UI",sans-serif;min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}

#app{max-width:560px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-title{min-width:0}
.sub{font-size:13px;color:var(--muted)}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface2)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.card h2{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* summary */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.sum{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum.main{grid-column:1/-1;padding:18px 16px 16px;background:var(--brand-grad) top left/100% 4px no-repeat,var(--surface)}
.sum span{font-size:13px;color:var(--muted)}
.sum b{font-size:22px;line-height:1.2}
.sum.main b{font-size:30px}
.sum em{font-style:normal;font-size:13px;color:var(--muted)}
.in{color:var(--in)} .due{color:var(--due)} .out{color:var(--out)}
.sumlist{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.sumlist div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sumlist span{font-size:14px;color:var(--muted)}
.sumlist b{font-size:19px}

/* inputs */
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;font-size:16px}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.searchrow{position:relative;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.amt{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.amt i{font-style:normal;font-size:26px;font-weight:700;color:var(--muted)}
.amt input{border:0;padding:10px 0;font-size:28px;font-weight:700;background:transparent;min-height:56px}
.amt input:focus-visible{outline:none}
.amt:focus-within{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent)}

/* chips & seg */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0;margin:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;min-height:42px;font-weight:600;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:52px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button small{font-weight:500;font-size:12px;opacity:.85}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.seg button.on[data-v=received]{color:var(--in)} .seg button.on[data-v=bill]{color:var(--due)} .seg button.on[data-v=given]{color:var(--out)}

/* buttons */
.btn{min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;line-height:1.2}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--text)}
.btn.in{background:var(--in-bg);border-color:transparent;color:#fff}
.btn.due{background:var(--due-bg);border-color:transparent;color:#fff}
.btn.out{background:var(--out-bg);border-color:transparent;color:#fff}
.btn.wa{background:var(--wa-bg);border-color:transparent;color:#fff}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.actions .btn{flex-direction:column;gap:0;padding:8px 6px;min-height:58px}
.actions .btn small{font-weight:500;font-size:12px;opacity:.9}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* client list */
.list{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;text-decoration:none;min-height:68px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 60% 24%);flex:none}
@media (prefers-color-scheme:dark){.avatar{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 85%)}}
.cmain{flex:1;min-width:0}
.cname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camt{text-align:right;font-weight:800;font-size:17px;flex:none}
.camt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:calc(max(0px,(100vw - 560px)/2) + 16px);z-index:10;border:0;border-radius:999px;background:var(--primary);color:var(--primary-ink);min-height:54px;padding:0 20px;font-weight:700;box-shadow:0 8px 24px rgba(212,38,14,.35);display:inline-flex;align-items:center;gap:8px}

/* client page */
.balcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px;border-left:6px solid var(--line)}
.balcard.due{border-left-color:var(--due-bg)} .balcard.in{border-left-color:var(--in-bg)}
.balcard .bl{font-size:13px;color:var(--muted);font-weight:600}
.balcard .bv{font-size:34px;font-weight:800;line-height:1.15}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.stats span{font-size:12px;color:var(--muted);display:block}
.stats b{font-size:17px}
.contact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sec h2{font-size:16px}
.erow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;min-height:64px;margin-bottom:8px}
.edate{width:48px;font-size:12px;color:var(--muted);text-align:center;line-height:1.25;flex:none}
.edate b{display:block;font-size:18px;color:var(--text)}
.emain{flex:1;min-width:0}
.etype{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.enote{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eamt{text-align:right;font-weight:800;flex:none}
.eamt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.in{background:var(--in-soft);color:var(--in)} .pill.due{background:var(--due-soft);color:var(--due)} .pill.out{background:var(--out-soft);color:var(--out)}
.dgroup{font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 6px}

/* templates */
.tgroup{margin-top:14px}
.tgroup h3{font-size:14px;margin:0 2px 6px}
.trow{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px}
.trow p{font-size:13.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .th{display:flex;align-items:center;gap:8px;font-weight:700}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.vars button{border:1px dashed var(--line);background:var(--surface2);border-radius:8px;min-height:34px;padding:0 10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.preview{white-space:pre-wrap;background:#e9fbd7;color:#16200f;border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:15px;line-height:1.5;max-height:240px;overflow:auto}
@media (prefers-color-scheme:dark){.preview{background:#1f3a2a;color:#e8f5ec}}

/* receipt preview */
.rcpt-prev{flex:none;background:var(--surface2);border-radius:14px;padding:10px;max-height:50vh;overflow:auto}
.rcpt-canvas{display:block;width:100%;height:auto;border-radius:6px;box-shadow:var(--shadow);background:#fff}

/* bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:12px;color:var(--muted);text-decoration:none;min-height:56px}
#nav a.on{color:var(--primary);font-weight:700}

/* banner */
.banner{display:flex;align-items:center;gap:10px;background:var(--due-soft);color:var(--text);border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.banner .btn{margin-left:auto;flex:none;white-space:nowrap}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(30,12,8,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.overlay.show{opacity:1}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(28px);transition:transform .22s;display:flex;flex-direction:column;gap:14px}
.overlay.show .sheet{transform:none}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px}}
.shead{display:flex;align-items:center;gap:8px}
.shead h2{font-size:18px;flex:1;min-width:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.bigamt{font-size:34px;font-weight:800}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#2b1511;color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;z-index:100;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.noscroll #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-16px)}
body.noscroll #toast.show{transform:translate(-50%,0)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="Main"></nav>
<div id="layers"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   Jyot Khata — client ledger + ready payment messages (HI / EN / GU)
   Local-first: all data stays on this phone (localStorage). Backup/restore in Settings.
   ===================================================================== */

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dUI = s => { const [y, m, d] = s.split('-').map(Number); return `${d} ${MON[m - 1]} ${y}`; };
const dMsg = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const fmtN = p => (p / 100).toLocaleString('en-IN', { minimumFractionDigits: p % 100 ? 2 : 0, maximumFractionDigits: 2 });
const fmtR = p => (p < 0 ? '-' : '') + '₹' + fmtN(Math.abs(p));
const parseAmount = v => { const n = parseFloat(String(v).replace(/[₹,\s]/g, '')); return isFinite(n) && n > 0 && n < 1e9 ? Math.round(n * 100) : NaN; };
const hue = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };
const initial = s => ([...String(s).trim()][0] || '?').toUpperCase();

const IC = {
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  back:'<path d="M15 18l-6-6 6-6"/>', x:'<path d="M18 6L6 18M6 6l12 12"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.2-5.4A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 9.2c.2 2.6 2.4 4.9 5.2 5.3l1.3-1.3-1.9-1-.8.7c-.9-.4-1.6-1.1-2-2l.7-.8-1-1.9z"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- reference data ---------- */
const LANGS = { hi: { name: 'हिंदी', tag: 'HI' }, en: { name: 'English', tag: 'EN' }, gu: { name: 'ગુજરાતી', tag: 'GU' } };

/* ---------- storage ---------- */
const KEY = 'jyotkhata.v1';
let storageOK = true;
function defaultDB() {
  return {
    v: 1,
    settings: { business: 'Jyot Enterprise', owner: '', phone: '', upi: '', address: '', cc: '91', lang: 'hi', prefix: 'JE', receiptNote: '' },
    clients: [], entries: [], templates: [],
    meta: { nextReceipt: 1, lastBackup: null, lastMode: 'upi', created: Date.now() },
  };
}
function syncTemplates(d) {
  const have = new Map(d.templates.map(t => [t.id, t]));
  for (const t of DEFAULT_TEMPLATES) {
    const cur = have.get(t.id);
    if (!cur) d.templates.push({ ...t, edited: false });
    else if (!cur.edited) cur.text = t.text;
  }
}
function migrate(d) {
  const base = defaultDB();
  d.settings = { ...base.settings, ...(d.settings || {}) };
  d.meta = { ...base.meta, ...(d.meta || {}) };
  d.clients = Array.isArray(d.clients) ? d.clients : [];
  d.entries = Array.isArray(d.entries) ? d.entries : [];
  d.templates = Array.isArray(d.templates) ? d.templates : [];
  syncTemplates(d);
  return d;
}
function loadDB() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { storageOK = false; console.warn('Storage unavailable', e); }
  return migrate(defaultDB());
}
let db = loadDB();
let warnedSave = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
  catch (e) {
    storageOK = false;
    if (!warnedSave) { warnedSave = true; toast('⚠️ Could not save on this device. Export a backup now.'); }
  }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- ledger maths (all money in paise = integers) ---------- */
const client = id => db.clients.find(c => c.id === id);
function entriesOf(id) {
  return db.entries.filter(e => e.clientId === id)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
}
function balances() {
  const m = new Map();
  for (const e of db.entries) {
    let b = m.get(e.clientId);
    if (!b) { b = { bill: 0, rec: 0, giv: 0, last: '', count: 0 }; m.set(e.clientId, b); }
    if (e.type === 'received') b.rec += e.amount; else if (e.type === 'bill') b.bill += e.amount; else b.giv += e.amount;
    b.count++;
    const k = e.date + '|' + String(e.createdAt || 0).padStart(14, '0');
    if (k > b.last) b.last = k;
  }
  for (const b of m.values()) { b.total = b.bill + b.giv; b.pending = b.total - b.rec; }
  return m;
}
const EMPTY_BAL = { bill: 0, rec: 0, giv: 0, last: '', count: 0, total: 0, pending: 0 };
const calc = id => balances().get(id) || EMPTY_BAL;
// Balance as it stood right after `entry` (entries ordered by date, then creation time).
function calcAsOf(id, entry) {
  const b = { bill: 0, rec: 0, giv: 0 };
  for (const x of entriesOf(id)) {
    if (x.type === 'received') b.rec += x.amount; else if (x.type === 'bill') b.bill += x.amount; else b.giv += x.amount;
    if (x.id === entry.id) break;
  }
  b.total = b.bill + b.giv; b.pending = b.total - b.rec;
  return b;
}
const latestReceived = id => entriesOf(id).filter(e => e.type === 'received').pop() || null;
function nextReceipt() {
  const n = db.meta.nextReceipt++;
  return `${db.settings.prefix || 'RC'}-${String(n).padStart(4, '0')}`;
}

  return entriesOf(c.id).slice(-12).map(e =>
    `${dMsg(e.date)} • ${TYPE_MSG[e.type][lang]} • ₹${fmtN(e.amount)}${e.mode ? ` (${modeLabel(e.mode, lang)})` : ''}`).join('\n');
}
function vars(c, e, lang, asOf = false) {
  const b = asOf && e ? calcAsOf(c.id, e) : calc(c.id), s = db.settings;
  return {
    name: c.name, business: s.business, owner: s.owner, phone: s.phone, upi: s.upi, address: s.address,
    amount: e ? fmtN(e.amount) : '', mode: e && e.mode ? modeLabel(e.mode, lang) : '',
    date: dMsg(e ? e.date : todayStr()), receipt_no: (e && e.receiptNo) || '',
    total: fmtN(b.total), received: fmtN(b.rec), pending: fmtN(Math.max(0, b.pending)),
    statement: buildStatement(c, lang),

}

// A line that contains a variable with no value is dropped (e.g. "UPI: {upi}" when no UPI id is saved).
function renderTemplate(text, v) {
  const out = [];
  for (const line of String(text).split('\n')) {
    let empty = false;
    const r = line.replace(/\{(\w+)\}/g, (m, k) => {
      if (!(k in v)) return m;
      const val = v[k];
      if (val === '' || val == null) { empty = true; return ''; }
      return String(val);
    });
    if (!empty) out.push(r.replace(/[ \t]+$/, ''));
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

const tplName = t => t.builtin ? KINDS[t.kind].label : (t.name || 'Untitled');

  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0';

/* ---------- sheets (bottom dialogs) with Android back-button support ---------- */
const layers = $('#layers');
const stack = [];
let depth = 0, skipPop = false, pendingHash = null, syncT = null;
function syncHistory() {
  clearTimeout(syncT);
  syncT = setTimeout(() => {
    const want = stack.length;
    while (depth < want) { history.pushState({ sheet: depth + 1 }, '', location.href); depth++; }
    if (depth > want) { const n = depth - want; depth = want; skipPop = true; history.go(-n); }
  }, 0);
}
function openSheet(html, handlers = {}) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  layers.appendChild(ov);
  document.body.classList.add('noscroll');
  const sh = ov.firstElementChild;
  const api = {
    el: sh,
    close(noSync) {
      if (!ov.isConnected) return;
      ov.remove();
      const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1);
      if (!stack.length) document.body.classList.remove('noscroll');
      if (!noSync) syncHistory();
    },
  };
  stack.push(api);
  let downOnBackdrop = false;
  ov.addEventListener('pointerdown', e => { downOnBackdrop = e.target === ov; });
  ov.addEventListener('click', e => { if (e.target === ov && downOnBackdrop) api.close(); });
  sh.addEventListener('click', e => {
    const t = e.target.closest('[data-s]');
    if (!t || !sh.contains(t)) return;
    const name = t.dataset.s;
    if (name === 'close') return api.close();
    if (handlers[name]) handlers[name](t, e, api);
  });
  requestAnimationFrame(() => ov.classList.add('show'));
  syncHistory();
  return api;
}
window.addEventListener('popstate', () => {
  if (skipPop) {
    skipPop = false;
    if (pendingHash) { const h = pendingHash; pendingHash = null; location.hash = h; }
    return;
  }
  if (depth > 0) { depth--; const top = stack[stack.length - 1]; if (top) top.close(true); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) stack[stack.length - 1].close(); });
// Navigate safely even while sheets are open (closes them and unwinds their history entries first).
function goto(h) {
  stack.slice().forEach(s => s.close(true));
  if (depth > 0) { const n = depth; depth = 0; pendingHash = h; skipPop = true; history.go(-n); }
  else if (location.hash === h) render();
  else location.hash = h;
}
function askConfirm({ title, text, ok = 'Delete', danger = true }) {
  return new Promise(res => {
    let done = false;
    const finish = v => { if (!done) { done = true; res(v); } };
    const sh = openSheet(`
      <div class="shead"><h2>${esc(title)}</h2></div>
      <p class="muted">${esc(text)}</p>
      <div class="row2"><button class="btn" data-s="no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-s="yes">${esc(ok)}</button></div>`,
      { no: (t, e, api) => { finish(false); api.close(); }, yes: (t, e, api) => { finish(true); api.close(); } });
    const orig = sh.close; sh.close = n => { finish(false); orig(n); };
  });
}

function periodRange(p) {
  const t = todayStr(), now = new Date();
  if (p === 'today') return [t, t];
  if (p === 'week') { const d = new Date(now); d.setDate(d.getDate() - 6); return [ymd(d), t]; }
  if (p === 'month') return [t.slice(0, 7) + '-01', t.slice(0, 7) + '-31'];
  if (p === 'lastmonth') { const d = new Date(now.getFullYear(), now.getMonth() - 1, 1); const ym = ymd(d).slice(0, 7); return [ym + '-01', ym + '-31']; }
  return ['0000-00-00', '9999-99-99'];
}

  // account summary (balance as it stood right after this payment)
  const sy = dy + 16;
  rr(M, sy, W - 2 * M, 116, 12); x.fillStyle = '#fffaf4'; x.fill(); x.strokeStyle = LINE; x.lineWidth = 1.2; x.stroke();
  T(L.summary, M + 16, sy + 22, { w: 700, size: 13, color: MUTED });
  const ry = i => sy + 44 + i * 26;
  const line = (i, k, v, o = {}) => { T(k, M + 16, ry(i), { size: 14, w: o.w || 400 }); T(v, W - M - 16, ry(i), { w: o.w || 600, size: o.size || 14.5, color: o.color || INK, align: 'right' }); };
  line(0, L.total, fmtR(b.total)); line(1, L.received, fmtR(b.rec)); rule(ry(1) + 9, M + 16, W - 2 * M - 32);
  line(2, b.pending < 0 ? L.advance : L.pending, fmtR(Math.abs(b.pending)), { w: 700, size: 16, color: b.pending > 0 ? '#a8480a' : '#12683c' });

  // footer
  let fy = H - 150;
  T(L.thanks, W / 2, fy, { w: 700, size: 15, align: 'center' }); fy += 18; F(400, 11.5);
  for (const n of [e.mode === 'cheque' ? L.cheque : '', s.receiptNote].filter(Boolean))
    for (const ln of clampLines(x, wrapLines(x, n, W - 2 * M - 40), 2, W - 2 * M - 40)) { T(ln, W / 2, fy, { size: 11.5, color: MUTED, align: 'center' }); fy += 15; }
  const sw = 200, sx = W - M - sw, who = s.owner || s.business || '';
  x.fillStyle = INK; x.fillRect(sx, H - 62, sw, 1);
  T(L.sign, sx + sw / 2, H - 46, { size: 11, color: MUTED, align: 'center' });
  F(600, 11);
  clampLines(x, wrapLines(x, who, sw), 2, sw).forEach((ln, i) => T(ln, sx + sw / 2, H - 31 + i * 13, { w: 600, size: 11, align: 'center' }));
  T(L.auto, M, H - 22, { size: 10, color: MUTED });

  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));

}
function buildPDF(jpeg, wPx, hPx, title) {      // one A5 page that shows the JPEG full-bleed
  const PW = 419.53, PH = 595.28, enc = new TextEncoder(), chunks = [], xref = [];

  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  xref[4] = pos;
  add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  add(jpeg); add('\nendstream\nendobj\n');
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  obj(6, `<< /Title (${safe}) /Producer (Jyot Khata) >>`);
  const xpos = pos;
  let xr = 'xref\n0 7\n0000000000 65535 f \n';
  for (let i = 1; i <= 6; i++) xr += String(xref[i]).padStart(10, '0') + ' 00000 n \n';
  add(xr + `trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xpos}\n%%EOF`);

}
async function shareFile(file, text) {
  if (!file) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [file], text })) { await navigator.share({ files: [file], title: file.name, text }); return; }
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: file.name }); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  download(file.name, file, file.type); toast('Downloaded ✓ — attach it in WhatsApp');
}
function receiptSheet(entryId, lang0 = null) {
  const e = db.entries.find(x => x.id === entryId);
  if (!e || e.type !== 'received') return;
  const c = client(e.clientId); if (!c) return;
  const st = { lang: lang0 || c.lang || db.settings.lang, n: 0, pdf: null, img: null, text: '' };
  const base = `Receipt-${String(e.receiptNo || 'payment').replace(/[^A-Za-z0-9_-]/g, '')}-${e.date}`;
  const sh = openSheet(`
    <div class="shead"><h2>Receipt · ${esc(e.receiptNo || '')}</h2><button class="icon-btn" data-s="close" aria-label="Close">${ic('x')}</button></div>
    <div class="chips wrap">${LANG_KEYS.map(l => `<button class="chip" data-s="lang" data-v="${l}">${LANGS[l].name}</button>`).join('')}</div>
    <div class="rcpt-prev" data-prev></div>
    <div class="row2"><button class="btn wa" data-s="share" disabled>${ic('share')} Share PDF</button><button class="btn" data-s="dl" disabled>${ic('download')} Download</button></div>
    <button class="btn soft block" data-s="img" disabled>${ic('share')} Share as image</button>
    <p class="sub">Tap <b>Share PDF</b> → choose WhatsApp → pick the client. Your thank-you message is added as the caption.</p>`, {
    lang: t => { st.lang = t.dataset.v; paint(); },
    share: () => shareFile(st.pdf, st.text),
    img: () => shareFile(st.img, st.text),
    dl: () => { if (st.pdf) { download(st.pdf.name, st.pdf, 'application/pdf'); toast('PDF downloaded ✓'); } },
  });
  const prev = $('[data-prev]', sh.el), btns = $$('[data-s=share],[data-s=dl],[data-s=img]', sh.el);
  async function paint() {
    const n = ++st.n;
    $$('[data-s=lang]', sh.el).forEach(b => b.classList.toggle('on', b.dataset.v === st.lang));
    btns.forEach(b => { b.disabled = true; });
    prev.innerHTML = '<p class="sub" style="padding:28px;text-align:center">Preparing receipt…</p>';
    try {
      const { canvas, jpeg } = await renderReceipt(e, st.lang);
      if (n !== st.n || !sh.el.isConnected) return;
      canvas.className = 'rcpt-canvas'; prev.replaceChildren(canvas);
      st.pdf = new File([buildPDF(jpeg, canvas.width, canvas.height, base)], base + '.pdf', { type: 'application/pdf' });
      st.img = new File([jpeg], base + '.jpg', { type: 'image/jpeg' });
      const b = calcAsOf(c.id, e), t = pickTpl(b.pending > 0 ? 'thanks_pending' : 'thanks_full', st.lang);
      st.text = renderTemplate(t.text, vars(c, e, st.lang, true));
      btns.forEach(x => { x.disabled = false; });
    } catch (err) { console.error(err); prev.innerHTML = '<p class="sub" style="padding:28px;text-align:center">Could not create the receipt on this device.</p>'; }
  }
  paint();
}

/* ---------- export / import ---------- */
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=@]/.test(s) || /^[+\-][^\d\s]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function entriesCSV(list) {
  const head = ['Date', 'Client', 'Phone', 'Type', 'Amount', 'Mode', 'Reference', 'Note', 'Receipt no'];
  const rows = list.map(e => { const c = client(e.clientId) || {}; return [e.date, c.name, c.phone, TYPES[e.type].label, (e.amount / 100).toFixed(2), e.mode ? MODES[e.mode].en : '', e.ref, e.note, e.receiptNo]; });
  return '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}
async function exportBackup() {
  const name = `jyot-khata-backup-${todayStr()}.json`, data = JSON.stringify(db);
  const mark = () => { db.meta.lastBackup = Date.now(); save(); render(); };
  try {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); mark(); toast('Backup shared ✓'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  download(name, data, 'application/json'); mark(); toast('Backup downloaded ✓');
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.clients) || !Array.isArray(d.entries)) throw new Error('Not a Jyot Khata backup');
      const okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
      d.entries = d.entries.filter(e => e && e.id && e.clientId && TYPES[e.type] && Number.isInteger(e.amount) && okDate(e.date));
      if (await askConfirm({ title: 'Restore this backup?', text: `It has ${d.clients.length} clients and ${d.entries.length} entries. This REPLACES the ${db.clients.length} clients and ${db.entries.length} entries currently on this phone.`, ok: 'Restore', danger: true })) {
        db = migrate(d); save(); goto('#/'); toast('Backup restored ✓');
      }
    } catch (e) { toast('That file is not a valid Jyot Khata backup'); }
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
const ACT = {
  back: () => goto('#/'),
  addClient: () => clientForm(),
  editClient: t => clientForm(t.dataset.id),
  addEntry: t => entryForm({ clientId: t.dataset.client, type: t.dataset.type }),
  openEntry: t => entrySheet(t.dataset.id),
  msgClient: t => messageSheet({ clientId: t.dataset.id }),
  waChat: t => { const c = client(t.dataset.id); if (c) openUrl(waLink(c.phone, '')); },
  setFilter: t => { ui.filter = t.dataset.v; render(); },
  setPeriod: t => { ui.period = t.dataset.v; render(); },
  setTplLang: t => { ui.tplLang = t.dataset.v; render(); },
  editTpl: t => templateEditor(t.dataset.id),
  newTpl: () => templateEditor(),
  prefLang: t => { $('[name=lang]').value = t.dataset.v; $$('[data-act=prefLang]').forEach(b => b.classList.toggle('on', b === t)); },
  exportBackup: () => exportBackup(),
  importBackup: () => $('[data-change=import]').click(),
  exportCsv: () => {
    const list = routeName() === 'daybook' ? dayBookEntries() : [...db.entries].sort((a, b) => a.date.localeCompare(b.date));
    if (!list.length) return toast('Nothing to export');
    download(`jyot-khata-entries-${todayStr()}.csv`, entriesCSV(list), 'text/csv;charset=utf-8'); toast('CSV downloaded ✓');
  },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; render(); },
  wipe: async () => {
    if (await askConfirm({ title: 'Delete ALL data?', text: `This permanently deletes ${db.clients.length} clients and ${db.entries.length} entries from this phone. Download a backup first if you are unsure.`, ok: 'Delete everything' })) {
      db = migrate(defaultDB()); save(); goto('#/'); toast('All data deleted');
    }
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && !t.closest('.overlay') && ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-input=search]')) { ui.search = e.target.value; const l = $('[data-clist]'); if (l) l.innerHTML = clientListHTML(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-change=dbType]')) { ui.type = t.value; render(); }
  else if (t.matches('[data-change=dbMode]')) { ui.mode = t.value; render(); }
  else if (t.matches('[data-change=import]')) { if (t.files[0]) importBackup(t.files[0]); t.value = ''; }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.matches('[data-form=settings]')) {
    e.preventDefault();
    const v = f.elements, s = db.settings;
    s.business = v.business.value.trim(); s.owner = v.owner.value.trim(); s.phone = v.phone.value.trim();
    s.upi = v.upi.value.trim(); s.address = v.address.value.trim(); s.receiptNote = v.receiptNote.value.trim(); s.lang = v.lang.value;
    s.prefix = (v.prefix.value.trim() || 'RC').toUpperCase(); s.cc = v.cc.value.replace(/\D/g, '') || '91';
    save(); toast('Settings saved ✓');
  }
});

/* ---------- boot ---------- */
if (!location.hash) history.replaceState(null, '', '#/');
render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
